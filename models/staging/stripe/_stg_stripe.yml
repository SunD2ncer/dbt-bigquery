models:
  - name: stg_stripe__payments
    description: each row represents a unique transaction
    columns:
      - name: payment_id
        description: primary key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
        - relationships:
            arguments: 
              to: ref('stg_jaffle_shop_orders')
              field: order_id
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments: 
                values: ['credit_card', 'bank_transfer', 'coupon', 'gift_card']
          